<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARGUS</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: #0f1117;
      color: #e2e8f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    #setup, #app {
      width: 100%;
      max-width: 600px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #161b22;
      border: 1px solid #30363d;
    }

    #setup {
      padding: 2rem;
      gap: 1.2rem;
      justify-content: center;
    }

    #setup input {
      background: #0d1117;
      border: 1px solid #30363d;
      color: #e2e8f0;
      padding: 12px;
      border-radius: 8px;
      font-size: 1rem;
    }

    #setup button, #sendBtn {
      background: #238636;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px 18px;
      font-weight: 600;
      cursor: pointer;
    }

    header {
      padding: 1rem 1.2rem;
      border-bottom: 1px solid #30363d;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 12px;
      line-height: 1.4;
      font-size: 0.95rem;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .msg.user {
      align-self: flex-end;
      background: #1f6feb;
      color: #ffffff;
      border-bottom-right-radius: 2px;
    }

    .msg.assistant {
      align-self: flex-start;
      background: #21262d;
      color: #e2e8f0;
      border-bottom-left-radius: 2px;
      border: 1px solid #30363d;
    }

    .msg.pending {
      opacity: 0.6;
      font-style: italic;
    }

    #chatForm {
      display: flex;
      padding: 0.75rem;
      gap: 0.5rem;
      border-top: 1px solid #30363d;
      background: #161b22;
      align-items: center;
    }

    #input {
      flex: 1;
      background: #0d1117;
      border: 1px solid #30363d;
      color: #e2e8f0;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.95rem;
    }

    #input:focus {
      outline: 1px solid #58a6ff;
    }

    #micBtn {
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 10px 12px;
      cursor: pointer;
      font-size: 1.1rem;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #micBtn:hover {
      background: #30363d;
    }

    #micBtn.listening {
      background: #da3633;
      border-color: #f85149;
      box-shadow: 0 0 10px rgba(248, 81, 73, 0.5);
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.06); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>

  <!-- Setup Screen -->
  <div id="setup" style="display: none;">
    <h2>Connect to ARGUS</h2>
    <input type="text" id="backendUrlInput" placeholder="Backend URL (e.g. https://...railway.app)" />
    <input type="password" id="tokenInput" placeholder="Access Token" />
    <button id="saveConfig">Connect</button>
  </div>

  <!-- Chat Screen -->
  <div id="app" style="display: none;">
    <header>ARGUS ASSISTANT</header>
    <div id="messages"></div>
    <form id="chatForm">
      <input type="text" id="input" placeholder="Type or speak to ARGUS..." autocomplete="off" />
      <button type="button" id="micBtn" title="Speak to ARGUS">🎙️</button>
      <button type="submit" id="sendBtn">Send</button>
    </form>
  </div>

  <script>
    const CONFIG_KEY = "jarvis_config";
    let config = JSON.parse(localStorage.getItem(CONFIG_KEY) || "null");
    let sessionId = localStorage.getItem("jarvis_session_id") || null;

    const setupEl = document.getElementById("setup");
    const appEl = document.getElementById("app");

    function showSetup() {
      setupEl.style.display = "flex";
      appEl.style.display = "none";
    }

    function showApp() {
      setupEl.style.display = "none";
      appEl.style.display = "flex";
    }

    document.getElementById("saveConfig").addEventListener("click", () => {
      const backendUrl = document.getElementById("backendUrlInput").value.trim().replace(/\/$/, "");
      const token = document.getElementById("tokenInput").value.trim();
      if (!backendUrl || !token) return;
      config = { backendUrl, token };
      localStorage.setItem(CONFIG_KEY, JSON.stringify(config));
      showApp();
      loadChatHistory();
    });

    const messagesEl = document.getElementById("messages");
    const form = document.getElementById("chatForm");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("sendBtn");
    const micBtn = document.getElementById("micBtn");

    function addMessage(role, text) {
      const div = document.createElement("div");
      div.className = "msg " + role;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    // --- 1. Text-to-Speech (TTS) ---
    function speak(text) {
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();

      // Strip markdown syntax for natural voice output
      const cleanText = text.replace(/[*#`_]/g, "").trim();
      const utterance = new SpeechSynthesisUtterance(cleanText);
      utterance.rate = 1.0;
      utterance.pitch = 1.0;

      const voices = window.speechSynthesis.getVoices();
      const preferredVoice = voices.find(v => v.lang.startsWith("en") && !v.name.includes("Google"));
      if (preferredVoice) utterance.voice = preferredVoice;

      window.speechSynthesis.speak(utterance);
    }

    // --- 2. Speech-to-Text (STT) ---
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isListening = false;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = "en-US";

      recognition.onstart = () => {
        isListening = true;
        micBtn.classList.add("listening");
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        input.value = transcript;
        form.dispatchEvent(new Event("submit"));
      };

      recognition.onerror = (event) => {
        console.error("Speech recognition error:", event.error);
        micBtn.classList.remove("listening");
        isListening = false;
      };

      recognition.onend = () => {
        micBtn.classList.remove("listening");
        isListening = false;
      };

      micBtn.addEventListener("click", () => {
        if (isListening) {
          recognition.stop();
        } else {
          recognition.start();
        }
      });
    } else {
      micBtn.style.display = "none";
    }

    // --- 3. Chat History Loading ---
    async function loadChatHistory() {
      if (!config || !config.backendUrl || !config.token || !sessionId) return;

      try {
        const res = await fetch(`${config.backendUrl}/history/${sessionId}`, {
          headers: {
            "Authorization": "Bearer " + config.token
          }
        });

        if (!res.ok) return;

        const data = await res.json();
        if (data.messages && data.messages.length > 0) {
          messagesEl.innerHTML = "";
          data.messages.forEach(msg => {
            const role = msg.role === "user" ? "user" : "assistant";
            addMessage(role, msg.content);
          });
          messagesEl.scrollTop = messagesEl.scrollHeight;
        }
      } catch (err) {
        console.error("Failed to restore history:", err);
      }
    }

    if (config && config.backendUrl && config.token) {
      showApp();
      loadChatHistory();
    } else {
      showSetup();
    }

    // --- 4. Submit Handler ---
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      addMessage("user", text);
      sendBtn.disabled = true;
      const pending = addMessage("assistant", "...");
      pending.classList.add("pending");

      try {
        const res = await fetch(config.backendUrl + "/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + config.token,
          },
          body: JSON.stringify({ message: text, session_id: sessionId }),
        });
        if (!res.ok) throw new Error("Request failed: " + res.status);
        const data = await res.json();
        sessionId = data.session_id;
        localStorage.setItem("jarvis_session_id", sessionId);
        pending.textContent = data.reply;
        pending.classList.remove("pending");
        speak(data.reply);
      } catch (err) {
        pending.textContent = "Error reaching ARGUS: " + err.message;
        pending.classList.remove("pending");
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    });

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
  </script>
</body>
</html>
