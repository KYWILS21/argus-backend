<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A.R.G.U.S. // SYSTEM HUD</title>
  <style>
    :root {
      --cyan-primary: #00f0ff;
      --cyan-dim: rgba(0, 240, 255, 0.2);
      --cyan-glow: rgba(0, 240, 255, 0.6);
      --bg-dark: #050b14;
      --panel-bg: rgba(6, 20, 36, 0.75);
      --alert-amber: #ffb84d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Courier New', Courier, monospace;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(0, 80, 120, 0.15), transparent 70%),
        linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 30px 30px, 30px 30px;
      color: var(--cyan-primary);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top HUD Navigation Bar */
    header {
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--cyan-dim);
      background: rgba(4, 12, 24, 0.85);
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 20px rgba(0, 240, 255, 0.1);
    }

    .brand-title {
      font-size: 1.4rem;
      letter-spacing: 4px;
      font-weight: 800;
      text-shadow: 0 0 10px var(--cyan-glow);
    }

    .status-panel {
      display: flex;
      gap: 16px;
      font-size: 0.8rem;
    }

    .status-tag {
      padding: 4px 10px;
      border: 1px solid var(--cyan-dim);
      border-radius: 3px;
      background: rgba(0, 240, 255, 0.05);
      letter-spacing: 1px;
    }

    .status-tag.active {
      border-color: var(--cyan-primary);
      background: rgba(0, 240, 255, 0.2);
      box-shadow: 0 0 8px var(--cyan-glow);
    }

    /* Main Command Workspace */
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 20px;
      padding: 20px;
      min-height: 0;
    }

    /* Left Column: Arc Core Visualizer */
    .left-hud {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--panel-bg);
      border: 1px solid var(--cyan-dim);
      border-radius: 6px;
      padding: 24px;
      position: relative;
      box-shadow: inset 0 0 15px rgba(0, 240, 255, 0.05);
    }

    .arc-reactor-box {
      width: 200px;
      height: 200px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .outer-ring {
      width: 100%;
      height: 100%;
      border: 2px dashed var(--cyan-dim);
      border-radius: 50%;
      position: absolute;
      animation: spinClockwise 20s linear infinite;
    }

    .inner-ring {
      width: 80%;
      height: 80%;
      border: 2px solid var(--cyan-primary);
      border-radius: 50%;
      position: absolute;
      border-top-color: transparent;
      animation: spinCounter 10s linear infinite;
      box-shadow: 0 0 12px var(--cyan-glow);
    }

    .reactor-core {
      width: 50%;
      height: 50%;
      background: radial-gradient(circle, #fff 0%, var(--cyan-primary) 60%, transparent 100%);
      border-radius: 50%;
      box-shadow: 0 0 25px var(--cyan-primary);
      transition: all 0.3s ease;
    }

    .arc-reactor-box.recording .reactor-core {
      background: radial-gradient(circle, #fff 0%, var(--alert-amber) 60%, transparent 100%);
      box-shadow: 0 0 35px var(--alert-amber);
      transform: scale(1.15);
    }

    .core-label {
      margin-top: 24px;
      font-size: 0.75rem;
      letter-spacing: 2px;
      opacity: 0.8;
      text-align: center;
    }

    /* Right Column: Terminal Transcript */
    .terminal-container {
      display: flex;
      flex-direction: column;
      background: var(--panel-bg);
      border: 1px solid var(--cyan-dim);
      border-radius: 6px;
      min-height: 0;
      position: relative;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5);
    }

    .terminal-logs {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .log-line {
      display: flex;
      gap: 12px;
      line-height: 1.5;
      font-size: 0.9rem;
    }

    .log-sender {
      font-weight: bold;
      color: var(--cyan-primary);
      min-width: 90px;
      letter-spacing: 1px;
    }

    .log-sender.user {
      color: var(--alert-amber);
    }

    .log-content {
      color: #e0f7fa;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* Input Dock */
    .input-dock {
      padding: 16px;
      border-top: 1px solid var(--cyan-dim);
      background: rgba(3, 10, 20, 0.9);
      display: flex;
      gap: 12px;
    }

    .command-input {
      flex: 1;
      background: rgba(0, 240, 255, 0.05);
      border: 1px solid var(--cyan-dim);
      padding: 12px 16px;
      color: #fff;
      font-size: 0.95rem;
      border-radius: 4px;
      outline: none;
      transition: border-color 0.2s;
    }

    .command-input:focus {
      border-color: var(--cyan-primary);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
    }

    .hud-btn {
      background: rgba(0, 240, 255, 0.1);
      border: 1px solid var(--cyan-primary);
      color: var(--cyan-primary);
      padding: 0 20px;
      cursor: pointer;
      font-weight: bold;
      border-radius: 4px;
      letter-spacing: 1px;
      transition: all 0.2s;
    }

    .hud-btn:hover {
      background: var(--cyan-primary);
      color: #000;
      box-shadow: 0 0 12px var(--cyan-glow);
    }

    .hud-btn.active {
      background: var(--alert-amber);
      border-color: var(--alert-amber);
      color: #000;
    }

    /* Keyframe Animations */
    @keyframes spinClockwise {
      100% { transform: rotate(360deg); }
    }

    @keyframes spinCounter {
      100% { transform: rotate(-360deg); }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">A.R.G.U.S. // PROTOCOL</div>
    <div class="status-panel">
      <div id="status-net" class="status-tag active">ONLINE</div>
      <div id="status-tools" class="status-tag">SYSTEM IDLE</div>
    </div>
  </header>

  <main>
    <!-- Core Visualizer Panel -->
    <div class="left-hud">
      <div id="reactor-box" class="arc-reactor-box" title="Click to talk">
        <div class="outer-ring"></div>
        <div class="inner-ring"></div>
        <div class="reactor-core"></div>
      </div>
      <div id="voice-label" class="core-label">CLICK CORE OR [MIC] TO TRANSMIT</div>
    </div>

    <!-- Terminal Transcript Panel -->
    <div class="terminal-container">
      <div id="terminal-logs" class="terminal-logs">
        <div class="log-line">
          <span class="log-sender">ARGUS</span>
          <span class="log-content">System initialized. Memory, Calendar, and Web feeds synced. How may I assist you?</span>
        </div>
      </div>

      <div class="input-dock">
        <button id="mic-btn" class="hud-btn">MIC</button>
        <input id="prompt-input" class="command-input" type="text" placeholder="Enter directive..." autocomplete="off">
        <button id="exec-btn" class="hud-btn">EXECUTE</button>
      </div>
    </div>
  </main>

  <script>
    // Configuration endpoints & security credentials
    const API_BASE = "https://argus-backend-production-e7bd.up.railway.app";
    const AUTH_BEARER = "argus_secret_2026"; // Replace with your Railway ARGUS_BEARER_TOKEN

    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;

    // Elements
    const terminal = document.getElementById("terminal-logs");
    const promptInput = document.getElementById("prompt-input");
    const execBtn = document.getElementById("exec-btn");
    const micBtn = document.getElementById("mic-btn");
    const reactorBox = document.getElementById("reactor-box");
    const voiceLabel = document.getElementById("voice-label");
    const statusTools = document.getElementById("status-tools");

    // Persist session ID
    let sessionId = localStorage.getItem("argus_session_id");
    if (!sessionId) {
      sessionId = crypto.randomUUID();
      localStorage.setItem("argus_session_id", sessionId);
    }

    function appendLog(sender, text, isUser = false) {
      const line = document.createElement("div");
      line.className = "log-line";

      const badge = document.createElement("span");
      badge.className = `log-sender ${isUser ? "user" : ""}`;
      badge.textContent = sender;

      const body = document.createElement("span");
      body.className = "log-content";
      body.textContent = text;

      line.appendChild(badge);
      line.appendChild(body);
      terminal.appendChild(line);
      terminal.scrollTop = terminal.scrollHeight;
    }

    async function sendDirective(message) {
      if (!message.trim()) return;
      appendLog("KYLE", message, true);
      promptInput.value = "";
      statusTools.textContent = "PROCESSING DIRECTIVE...";
      statusTools.classList.add("active");

      try {
        const res = await fetch(`${API_BASE}/chat`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${AUTH_BEARER}`
          },
          body: JSON.stringify({ message: message, session_id: sessionId })
        });

        if (!res.ok) {
          throw new Error(`HTTP ${res.status}`);
        }

        const data = await res.json();
        appendLog("ARGUS", data.reply);
      } catch (err) {
        appendLog("ERROR", `Failed to route directive: ${err.message}`);
      } finally {
        statusTools.textContent = "SYSTEM IDLE";
        statusTools.classList.remove("active");
      }
    }

    // Voice Capture (Hold-to-Talk or Click-to-Toggle)
    async function toggleVoiceRecording() {
      if (!isRecording) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];

          mediaRecorder.ondataavailable = (e) => {
            if (e.data.size > 0) audioChunks.push(e.data);
          };

          mediaRecorder.onstop = async () => {
            const audioBlob = new Blob(audioChunks, { type: "audio/webm" });
            voiceLabel.textContent = "TRANSCRIBING AUDIO...";
            statusTools.textContent = "WHISPER TRANSCRIBING...";

            const formData = new FormData();
            formData.append("file", audioBlob, "recording.webm");

            try {
              const res = await fetch(`${API_BASE}/transcribe`, {
                method: "POST",
                headers: {
                  "Authorization": `Bearer ${AUTH_BEARER}`
                },
                body: formData
              });

              if (!res.ok) throw new Error(`Transcription failed: ${res.status}`);
              const data = await res.json();
              if (data.text) {
                promptInput.value = data.text;
                sendDirective(data.text);
              }
            } catch (err) {
              appendLog("ERROR", `Audio pipe error: ${err.message}`);
            } finally {
              voiceLabel.textContent = "CLICK CORE OR [MIC] TO TRANSMIT";
              statusTools.textContent = "SYSTEM IDLE";
            }
          };

          mediaRecorder.start();
          isRecording = true;
          reactorBox.classList.add("recording");
          micBtn.classList.add("active");
          voiceLabel.textContent = "LISTENING... CLICK AGAIN TO SEND";
        } catch (err) {
          appendLog("ERROR", `Microphone device unavailable: ${err.message}`);
        }
      } else {
        mediaRecorder.stop();
        isRecording = false;
        reactorBox.classList.remove("recording");
        micBtn.classList.remove("active");
      }
    }

    // Event Listeners
    execBtn.addEventListener("click", () => sendDirective(promptInput.value));
    promptInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendDirective(promptInput.value);
    });

    micBtn.addEventListener("click", toggleVoiceRecording);
    reactorBox.addEventListener("click", toggleVoiceRecording);
  </script>
</body>
</html>
