<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ARGUS</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0b0f14" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0b0f14;
    color: #e8edf2;
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 16px 20px;
    border-bottom: 1px solid #1c2530;
    font-weight: 600;
    letter-spacing: 0.02em;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  header .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #38e07a;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.4;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: #2563eb;
    color: white;
    border-bottom-right-radius: 4px;
  }
  .msg.assistant {
    align-self: flex-start;
    background: #171f29;
    border-bottom-left-radius: 4px;
  }
  .msg.pending { opacity: 0.6; }
  form {
    display: flex;
    gap: 8px;
    padding: 12px;
    border-top: 1px solid #1c2530;
    padding-bottom: calc(12px + env(safe-area-inset-bottom));
  }
  input[type="text"] {
    flex: 1;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid #1c2530;
    background: #0f151d;
    color: #e8edf2;
    font-size: 16px;
  }
  button {
    padding: 12px 18px;
    border-radius: 12px;
    border: none;
    background: #2563eb;
    color: white;
    font-weight: 600;
    font-size: 15px;
  }
  button:disabled { opacity: 0.5; }
  #setup {
    padding: 20px;
    max-width: 420px;
    margin: auto;
  }
  #setup input { width: 100%; margin-bottom: 10px; }
  #setup label { font-size: 13px; color: #9fb0c0; }
</style>
</head>
<body>

<div id="setup" style="display:none;">
  <header style="border:none; padding:0; margin-bottom:16px;">Connect to your ARGUS backend</header>
  <label>Backend URL (e.g. https://your-app.up.railway.app)</label>
  <input type="text" id="backendUrlInput" placeholder="https://..." />
  <label>Access token</label>
  <input type="text" id="tokenInput" placeholder="the ACCESS_TOKEN you set on the server" />
  <button id="saveConfig" style="width:100%;">Save & Connect</button>
</div>

<div id="app" style="display:none; flex:1; display:flex; flex-direction:column; height:100%;">
  <header><span class="dot"></span> ARGUS</header>
  <div id="messages"></div>
  <form id="chatForm">
    <input type="text" id="input" placeholder="Ask ARGUS..." autocomplete="off" />
    <button type="submit" id="sendBtn">Send</button>
  </form>
</div>

<script>
  const CONFIG_KEY = "jarvis_config";
  let config = JSON.parse(localStorage.getItem(CONFIG_KEY) || "null");
  let sessionId = localStorage.getItem("jarvis_session_id") || null;

  const setupEl = document.getElementById("setup");
  const appEl = document.getElementById("app");

  function showSetup() {
    setupEl.style.display = "block";
    appEl.style.display = "none";
  }
  function showApp() {
    setupEl.style.display = "none";
    appEl.style.display = "flex";
  }

  document.getElementById("saveConfig").addEventListener("click", () => {
    const backendUrl = document.getElementById("backendUrlInput").value.trim().replace(/\/$/, "");
    const token = document.getElementById("tokenInput").value.trim();
    if (!backendUrl || !token) return;
    config = { backendUrl, token };
    localStorage.setItem(CONFIG_KEY, JSON.stringify(config));
    showApp();
  });

  if (config && config.backendUrl && config.token) {
    showApp();
  } else {
    showSetup();
  }

  const messagesEl = document.getElementById("messages");
  const form = document.getElementById("chatForm");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("sendBtn");

  function addMessage(role, text) {
    const div = document.createElement("div");
    div.className = "msg " + role;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    addMessage("user", text);
    sendBtn.disabled = true;
    const pending = addMessage("assistant", "...");
    pending.classList.add("pending");

    try {
      const res = await fetch(config.backendUrl + "/chat", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + config.token,
        },
        body: JSON.stringify({ message: text, session_id: sessionId }),
      });
      if (!res.ok) throw new Error("Request failed: " + res.status);
      const data = await res.json();
      sessionId = data.session_id;
      localStorage.setItem("jarvis_session_id", sessionId);
      pending.textContent = data.reply;
      pending.classList.remove("pending");
    } catch (err) {
      pending.textContent = "Error reaching ARGUS: " + err.message;
      pending.classList.remove("pending");
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  });

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
</script>
</body>
</html>
