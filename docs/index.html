<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A.R.G.U.S. // SYSTEM HUD</title>
  <style>
    :root {
      --cyan-primary: #00f0ff;
      --cyan-dim: rgba(0, 240, 255, 0.2);
      --cyan-glow: rgba(0, 240, 255, 0.6);
      --bg-dark: #050b14;
      --panel-bg: rgba(6, 20, 36, 0.75);
      --alert-amber: #ffb84d;
      --alert-red: #ff4d4d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Courier New', Courier, monospace;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(0, 80, 120, 0.15), transparent 70%),
        linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 30px 30px, 30px 30px;
      color: var(--cyan-primary);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    header {
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--cyan-dim);
      background: rgba(4, 12, 24, 0.85);
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 20px rgba(0, 240, 255, 0.1);
      z-index: 10;
    }

    .brand-title {
      font-size: 1.4rem;
      letter-spacing: 4px;
      font-weight: 800;
      text-shadow: 0 0 10px var(--cyan-glow);
    }

    .status-panel {
      display: flex;
      gap: 12px;
      font-size: 0.8rem;
    }

    .status-tag {
      padding: 5px 12px;
      border: 1px solid var(--cyan-dim);
      border-radius: 3px;
      background: rgba(0, 240, 255, 0.05);
      letter-spacing: 1px;
      transition: all 0.2s ease;
      cursor: pointer;
      user-select: none;
    }

    .status-tag:hover {
      border-color: var(--cyan-primary);
      box-shadow: 0 0 8px var(--cyan-glow);
    }

    .status-tag.active {
      border-color: var(--cyan-primary);
      background: rgba(0, 240, 255, 0.2);
      box-shadow: 0 0 8px var(--cyan-glow);
    }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 20px;
      padding: 20px;
      min-height: 0;
      z-index: 1;
    }

    .left-hud {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      background: var(--panel-bg);
      border: 1px solid var(--cyan-dim);
      border-radius: 6px;
      padding: 24px;
      position: relative;
      box-shadow: inset 0 0 15px rgba(0, 240, 255, 0.05);
    }

    .arc-reactor-box {
      width: 190px;
      height: 190px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      margin-top: 10px;
    }

    .outer-ring {
      width: 100%;
      height: 100%;
      border: 2px dashed var(--cyan-dim);
      border-radius: 50%;
      position: absolute;
      animation: spinClockwise 20s linear infinite;
    }

    .inner-ring {
      width: 80%;
      height: 80%;
      border: 2px solid var(--cyan-primary);
      border-radius: 50%;
      position: absolute;
      border-top-color: transparent;
      animation: spinCounter 10s linear infinite;
      box-shadow: 0 0 12px var(--cyan-glow);
      transition: all 0.3s ease;
    }

    .reactor-core {
      width: 50%;
      height: 50%;
      background: radial-gradient(circle, #fff 0%, var(--cyan-primary) 60%, transparent 100%);
      border-radius: 50%;
      box-shadow: 0 0 25px var(--cyan-primary);
      transition: all 0.3s ease;
    }

    .arc-reactor-box.recording .reactor-core {
      background: radial-gradient(circle, #fff 0%, var(--alert-amber) 60%, transparent 100%);
      box-shadow: 0 0 35px var(--alert-amber);
      transform: scale(1.15);
    }

    .arc-reactor-box.recording .inner-ring {
      border-color: var(--alert-amber);
      box-shadow: 0 0 16px var(--alert-amber);
      animation-duration: 3s;
    }

    .arc-reactor-box.speaking .reactor-core {
      animation: corePulse 0.8s alternate infinite ease-in-out;
      box-shadow: 0 0 45px var(--cyan-primary), 0 0 60px #fff;
    }

    .arc-reactor-box.speaking .inner-ring {
      animation-duration: 1.5s;
      border-width: 3px;
      box-shadow: 0 0 24px var(--cyan-glow);
    }

    .visualizer-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    #visualizer-canvas {
      width: 100%;
      height: 90px;
      background: rgba(0, 15, 30, 0.6);
      border: 1px solid var(--cyan-dim);
      border-radius: 4px;
      box-shadow: inset 0 0 10px rgba(0, 240, 255, 0.1);
    }

    .core-label {
      font-size: 0.75rem;
      letter-spacing: 2px;
      opacity: 0.85;
      text-align: center;
    }

    .terminal-container {
      display: flex;
      flex-direction: column;
      background: var(--panel-bg);
      border: 1px solid var(--cyan-dim);
      border-radius: 6px;
      min-height: 0;
      position: relative;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5);
    }

    .terminal-logs {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .log-line {
      display: flex;
      gap: 12px;
      line-height: 1.5;
      font-size: 0.9rem;
    }

    .log-sender {
      font-weight: bold;
      color: var(--cyan-primary);
      min-width: 90px;
      letter-spacing: 1px;
    }

    .log-sender.user {
      color: var(--alert-amber);
    }

    .log-sender.system {
      color: #88a0b0;
    }

    .log-sender.error {
      color: var(--alert-red);
    }

    .log-content {
      color: #e0f7fa;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .input-dock {
      padding: 16px;
      border-top: 1px solid var(--cyan-dim);
      background: rgba(3, 10, 20, 0.9);
      display: flex;
      gap: 12px;
    }

    .command-input {
      flex: 1;
      background: rgba(0, 240, 255, 0.05);
      border: 1px solid var(--cyan-dim);
      padding: 12px 16px;
      color: #fff;
      font-size: 0.95rem;
      border-radius: 4px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .command-input:focus {
      border-color: var(--cyan-primary);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
    }

    .hud-btn {
      background: rgba(0, 240, 255, 0.1);
      border: 1px solid var(--cyan-primary);
      color: var(--cyan-primary);
      padding: 0 20px;
      cursor: pointer;
      font-weight: bold;
      border-radius: 4px;
      letter-spacing: 1px;
      transition: all 0.2s;
    }

    .hud-btn:hover {
      background: var(--cyan-primary);
      color: #000;
      box-shadow: 0 0 12px var(--cyan-glow);
    }

    .hud-btn.active {
      background: var(--alert-amber);
      border-color: var(--alert-amber);
      color: #000;
      box-shadow: 0 0 14px var(--alert-amber);
    }

    /* Slide-out Drawers */
    .hud-drawer {
      position: fixed;
      top: 0;
      right: -420px;
      width: 400px;
      height: 100vh;
      background: rgba(5, 14, 26, 0.95);
      backdrop-filter: blur(12px);
      border-left: 1px solid var(--cyan-primary);
      box-shadow: -10px 0 30px rgba(0, 240, 255, 0.15);
      transition: right 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 100;
      display: flex;
      flex-direction: column;
    }

    .hud-drawer.open {
      right: 0;
    }

    .drawer-header {
      padding: 20px;
      border-bottom: 1px solid var(--cyan-dim);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .drawer-title {
      font-size: 1.05rem;
      letter-spacing: 2px;
      font-weight: bold;
    }

    .drawer-close {
      background: none;
      border: 1px solid var(--cyan-dim);
      color: var(--cyan-primary);
      padding: 4px 8px;
      cursor: pointer;
      border-radius: 3px;
    }

    .drawer-close:hover {
      border-color: var(--alert-red);
      color: var(--alert-red);
    }

    .drawer-list {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .hud-card {
      background: rgba(0, 240, 255, 0.04);
      border: 1px solid var(--cyan-dim);
      border-radius: 4px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: border-color 0.2s;
    }

    .hud-card:hover {
      border-color: var(--cyan-primary);
    }

    .hud-card-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      opacity: 0.8;
    }

    .badge-canvas {
      color: var(--alert-amber);
      font-weight: bold;
    }

    .badge-primary {
      color: var(--cyan-primary);
      font-weight: bold;
    }

    .hud-card-title {
      font-size: 0.85rem;
      color: #e0f7fa;
      line-height: 1.4;
    }

    .memory-del-btn {
      align-self: flex-end;
      background: rgba(255, 77, 77, 0.1);
      border: 1px solid rgba(255, 77, 77, 0.4);
      color: var(--alert-red);
      font-size: 0.7rem;
      padding: 3px 8px;
      cursor: pointer;
      border-radius: 3px;
      letter-spacing: 1px;
    }

    .memory-del-btn:hover {
      background: var(--alert-red);
      color: #000;
    }

    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 99;
    }

    .drawer-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    @media (max-width: 850px) {
      main {
        grid-template-columns: 1fr;
        grid-template-rows: 320px 1fr;
      }
      .hud-drawer {
        width: 100vw;
        right: -100vw;
      }
    }

    @keyframes spinClockwise {
      100% { transform: rotate(360deg); }
    }

    @keyframes spinCounter {
      100% { transform: rotate(-360deg); }
    }

    @keyframes corePulse {
      0% { transform: scale(0.92); opacity: 0.8; }
      100% { transform: scale(1.18); opacity: 1.0; }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">A.R.G.U.S. // PROTOCOL</div>
    <div class="status-panel">
      <div id="btn-agenda" class="status-tag" title="View Canvas & Calendar Agenda">AGENDA // CANV</div>
      <div id="btn-memory" class="status-tag" title="Open Long-Term Memory Bank">MEMORY BANK</div>
      <div id="status-tts" class="status-tag active" title="Toggle audio voice playback">AUDIO: ON</div>
      <div id="status-key" class="status-tag" title="Click to update token">SET AUTH TOKEN</div>
      <div id="status-tools" class="status-tag">SYSTEM IDLE</div>
    </div>
  </header>

  <main>
    <div class="left-hud">
      <div id="reactor-box" class="arc-reactor-box" title="Click core to toggle audio transmission">
        <div class="outer-ring"></div>
        <div class="inner-ring"></div>
        <div class="reactor-core"></div>
      </div>

      <div class="visualizer-container">
        <canvas id="visualizer-canvas" width="340" height="90"></canvas>
        <div id="voice-label" class="core-label">CLICK CORE OR [MIC] TO TRANSMIT</div>
      </div>
    </div>

    <div class="terminal-container">
      <div id="terminal-logs" class="terminal-logs">
        <div class="log-line">
          <span class="log-sender">ARGUS</span>
          <span class="log-content">System initialized. Memory, Calendar, and Web feeds synced. How may I assist you?</span>
        </div>
      </div>

      <div class="input-dock">
        <button id="mic-btn" class="hud-btn" type="button">MIC</button>
        <input id="prompt-input" class="command-input" type="text" placeholder="Enter directive..." autocomplete="off">
        <button id="exec-btn" class="hud-btn" type="button">EXECUTE</button>
      </div>
    </div>
  </main>

  <div id="drawer-overlay" class="drawer-overlay"></div>

  <!-- Memory Bank Drawer -->
  <aside id="memory-drawer" class="hud-drawer">
    <div class="drawer-header">
      <div class="drawer-title">PERMANENT MEMORY BANK</div>
      <button id="memory-close" class="drawer-close">[CLOSE]</button>
    </div>
    <div id="memory-list" class="drawer-list"></div>
  </aside>

  <!-- Canvas Agenda Drawer -->
  <aside id="agenda-drawer" class="hud-drawer">
    <div class="drawer-header">
      <div class="drawer-title">CANVAS & CALENDAR AGENDA</div>
      <button id="agenda-close" class="drawer-close">[CLOSE]</button>
    </div>
    <div id="agenda-list" class="drawer-list"></div>
  </aside>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const API_BASE = "https://argus-backend-production-e7bd.up.railway.app";
      let authToken = localStorage.getItem("argus_auth_bearer") || "default_secret_token";
      let ttsEnabled = localStorage.getItem("argus_tts_enabled") !== "false";

      let mediaRecorder = null;
      let audioChunks = [];
      let isRecording = false;
      let activeStream = null;

      let audioCtx = null;
      let analyser = null;
      let audioSource = null;
      let animFrameId = null;

      const terminal = document.getElementById("terminal-logs");
      const promptInput = document.getElementById("prompt-input");
      const execBtn = document.getElementById("exec-btn");
      const micBtn = document.getElementById("mic-btn");
      const reactorBox = document.getElementById("reactor-box");
      const voiceLabel = document.getElementById("voice-label");
      const statusTools = document.getElementById("status-tools");
      const statusKey = document.getElementById("status-key");
      const statusTts = document.getElementById("status-tts");
      
      const drawerOverlay = document.getElementById("drawer-overlay");
      const btnMemory = document.getElementById("btn-memory");
      const memoryDrawer = document.getElementById("memory-drawer");
      const memoryClose = document.getElementById("memory-close");
      const memoryList = document.getElementById("memory-list");

      const btnAgenda = document.getElementById("btn-agenda");
      const agendaDrawer = document.getElementById("agenda-drawer");
      const agendaClose = document.getElementById("agenda-close");
      const agendaList = document.getElementById("agenda-list");

      const canvas = document.getElementById("visualizer-canvas");
      const canvasCtx = canvas.getContext("2d");

      canvas.width = canvas.clientWidth * window.devicePixelRatio || 340;
      canvas.height = canvas.clientHeight * window.devicePixelRatio || 90;

      function updateTtsUi() {
        statusTts.textContent = ttsEnabled ? "AUDIO: ON" : "AUDIO: MUTED";
        if (ttsEnabled) {
          statusTts.classList.add("active");
        } else {
          statusTts.classList.remove("active");
        }
      }
      updateTtsUi();

      statusTts.addEventListener("click", () => {
        ttsEnabled = !ttsEnabled;
        localStorage.setItem("argus_tts_enabled", ttsEnabled);
        updateTtsUi();
        if (!ttsEnabled && window.speechSynthesis) {
          window.speechSynthesis.cancel();
          reactorBox.classList.remove("speaking");
        }
      });

      if (authToken !== "default_secret_token") {
        statusKey.textContent = "AUTH LOADED";
        statusKey.classList.add("active");
      }

      statusKey.addEventListener("click", () => {
        const inputKey = prompt("Enter your ARGUS_BEARER_TOKEN from Railway:", authToken);
        if (inputKey !== null && inputKey.trim()) {
          authToken = inputKey.trim();
          localStorage.setItem("argus_auth_bearer", authToken);
          statusKey.textContent = "AUTH LOADED";
          statusKey.classList.add("active");
          appendLog("SYSTEM", "Auth token updated successfully.", "system");
        }
      });

      function closeAllDrawers() {
        memoryDrawer.classList.remove("open");
        agendaDrawer.classList.remove("open");
        drawerOverlay.classList.remove("open");
      }

      drawerOverlay.addEventListener("click", closeAllDrawers);
      memoryClose.addEventListener("click", closeAllDrawers);
      agendaClose.addEventListener("click", closeAllDrawers);

      // =========================================================
      // Agenda Drawer Handling
      // =========================================================
      async function loadAgenda() {
        agendaList.innerHTML = '<div style="font-size:0.8rem; opacity:0.7;">Querying Canvas & Calendar feeds...</div>';
        try {
          const res = await fetch(`${API_BASE}/agenda`, {
            headers: { "Authorization": `Bearer ${authToken.trim()}` }
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          renderAgenda(data.events || []);
        } catch (err) {
          agendaList.innerHTML = `<div style="color:var(--alert-red); font-size:0.85rem;">Failed to load agenda: ${err.message}</div>`;
        }
      }

      function renderAgenda(events) {
        if (!events.length) {
          agendaList.innerHTML = '<div style="font-size:0.85rem; opacity:0.7;">No upcoming assignments or events detected.</div>';
          return;
        }

        agendaList.innerHTML = "";
        events.forEach(e => {
          const card = document.createElement("div");
          card.className = "hud-card";

          const meta = document.createElement("div");
          meta.className = "hud-card-meta";

          const badge = document.createElement("span");
          const isCanvas = (e.calendar || "").toLowerCase().includes("canvas");
          badge.className = isCanvas ? "badge-canvas" : "badge-primary";
          badge.textContent = e.calendar.toUpperCase();

          const dateStr = document.createElement("span");
          if (e.start) {
            const d = new Date(e.start);
            dateStr.textContent = isNaN(d.getTime()) ? e.start : d.toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
          }

          meta.appendChild(badge);
          meta.appendChild(dateStr);

          const title = document.createElement("div");
          title.className = "hud-card-title";
          title.textContent = e.summary;

          card.appendChild(meta);
          card.appendChild(title);
          agendaList.appendChild(card);
        });
      }

      btnAgenda.addEventListener("click", () => {
        closeAllDrawers();
        agendaDrawer.classList.add("open");
        drawerOverlay.classList.add("open");
        loadAgenda();
      });

      // =========================================================
      // Memory Drawer Handling
      // =========================================================
      async function loadMemories() {
        memoryList.innerHTML = '<div style="font-size:0.8rem; opacity:0.7;">Fetching records from SQLite...</div>';
        try {
          const res = await fetch(`${API_BASE}/memories`, {
            headers: { "Authorization": `Bearer ${authToken.trim()}` }
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          renderMemoryCards(data.memories || []);
        } catch (err) {
          memoryList.innerHTML = `<div style="color:var(--alert-red); font-size:0.85rem;">Failed to load memories: ${err.message}</div>`;
        }
      }

      function renderMemoryCards(memories) {
        if (!memories.length) {
          memoryList.innerHTML = '<div style="font-size:0.85rem; opacity:0.7;">No memories stored in the bank yet.</div>';
          return;
        }

        memoryList.innerHTML = "";
        memories.forEach(m => {
          const card = document.createElement("div");
          card.className = "hud-card";

          const meta = document.createElement("div");
          meta.className = "hud-card-meta";

          const cat = document.createElement("span");
          cat.className = "badge-canvas";
          cat.textContent = (m.category || "GENERAL").toUpperCase();

          const date = document.createElement("span");
          date.textContent = m.created_at ? m.created_at.slice(0, 10) : "";

          meta.appendChild(cat);
          meta.appendChild(date);

          const fact = document.createElement("div");
          fact.className = "hud-card-title";
          fact.textContent = m.fact;

          const delBtn = document.createElement("button");
          delBtn.className = "memory-del-btn";
          delBtn.textContent = "PURGE";
          delBtn.addEventListener("click", async () => {
            if (confirm(`Purge this memory?\n"${m.fact}"`)) {
              await deleteMemory(m.id, card);
            }
          });

          card.appendChild(meta);
          card.appendChild(fact);
          card.appendChild(delBtn);
          memoryList.appendChild(card);
        });
      }

      async function deleteMemory(id, cardElement) {
        try {
          const res = await fetch(`${API_BASE}/memories/${id}`, {
            method: "DELETE",
            headers: { "Authorization": `Bearer ${authToken.trim()}` }
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          cardElement.remove();
          appendLog("SYSTEM", `Memory #${id} purged.`, "system");
        } catch (err) {
          alert(`Failed to delete record: ${err.message}`);
        }
      }

      btnMemory.addEventListener("click", () => {
        closeAllDrawers();
        memoryDrawer.classList.add("open");
        drawerOverlay.classList.add("open");
        loadMemories();
      });

      // Session Management
      let sessionId = localStorage.getItem("argus_session_id");
      if (!sessionId) {
        sessionId = crypto.randomUUID();
        localStorage.setItem("argus_session_id", sessionId);
      }

      function appendLog(sender, text, type = "") {
        if (!terminal) return;
        const line = document.createElement("div");
        line.className = "log-line";

        const badge = document.createElement("span");
        badge.className = `log-sender ${type}`;
        badge.textContent = sender;

        const body = document.createElement("span");
        body.className = "log-content";
        body.textContent = text;

        line.appendChild(badge);
        line.appendChild(body);
        terminal.appendChild(line);
        terminal.scrollTop = terminal.scrollHeight;
      }

      // Visualizer Engine
      function initVisualizer(stream) {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AudioContextClass();
        }

        if (audioCtx.state === "suspended") {
          audioCtx.resume();
        }

        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 64;
        analyser.smoothingTimeConstant = 0.8;

        audioSource = audioCtx.createMediaStreamSource(stream);
        audioSource.connect(analyser);

        renderWaveform();
      }

      function renderWaveform() {
        const width = canvas.width;
        const height = canvas.height;
        const bufferLength = analyser ? analyser.frequencyBinCount : 32;
        const dataArray = new Uint8Array(bufferLength);

        function draw(timestamp) {
          animFrameId = requestAnimationFrame(draw);
          canvasCtx.clearRect(0, 0, width, height);

          if (isRecording && analyser) {
            analyser.getByteFrequencyData(dataArray);
          } else {
            for (let i = 0; i < bufferLength; i++) {
              const speed = timestamp * 0.003;
              dataArray[i] = Math.max(8, Math.sin(speed + i * 0.3) * 20 + 22);
            }
          }

          const barCount = 24;
          const barSpacing = 4;
          const totalSpacing = barSpacing * (barCount - 1);
          const barWidth = (width - totalSpacing - 24) / barCount;

          for (let i = 0; i < barCount; i++) {
            const rawVal = dataArray[i % bufferLength] || 0;
            const barHeight = Math.max(4, (rawVal / 255) * (height - 14));

            const x = 12 + i * (barWidth + barSpacing);
            const y = (height - barHeight) / 2;

            if (isRecording) {
              canvasCtx.fillStyle = "#ffb84d";
              canvasCtx.shadowColor = "rgba(255, 184, 77, 0.8)";
            } else if (reactorBox.classList.contains("speaking")) {
              canvasCtx.fillStyle = "#00f0ff";
              canvasCtx.shadowColor = "rgba(0, 240, 255, 0.9)";
            } else {
              canvasCtx.fillStyle = "rgba(0, 240, 255, 0.35)";
              canvasCtx.shadowColor = "rgba(0, 240, 255, 0.2)";
            }

            canvasCtx.shadowBlur = 6;
            canvasCtx.fillRect(x, y, barWidth, barHeight);
          }
        }

        if (animFrameId) cancelAnimationFrame(animFrameId);
        animFrameId = requestAnimationFrame(draw);
      }

      renderWaveform();

      // Vocal Feedback
      function speakDirective(text) {
        if (!ttsEnabled || !("speechSynthesis" in window)) return;

        window.speechSynthesis.cancel();

        const cleanText = text
          .replace(/[*_#`~\[\]\(\)]/g, "")
          .replace(/https?:\/\/\S+/g, "link provided")
          .trim();

        if (!cleanText) return;

        const utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.rate = 1.05;
        utterance.pitch = 0.95;

        const voices = window.speechSynthesis.getVoices();
        const preferredVoice = voices.find(v => 
          (v.lang.includes("en-GB") || v.name.includes("UK") || v.name.includes("British") || v.name.includes("Daniel") || v.name.includes("Arthur")) &&
          !v.name.includes("Female")
        ) || voices.find(v => v.lang.startsWith("en"));

        if (preferredVoice) utterance.voice = preferredVoice;

        utterance.onstart = () => {
          reactorBox.classList.add("speaking");
          voiceLabel.textContent = "TRANSMITTING VOCAL FEED...";
        };

        utterance.onend = () => {
          reactorBox.classList.remove("speaking");
          voiceLabel.textContent = "CLICK CORE OR [MIC] TO TRANSMIT";
        };

        utterance.onerror = () => {
          reactorBox.classList.remove("speaking");
          voiceLabel.textContent = "CLICK CORE OR [MIC] TO TRANSMIT";
        };

        window.speechSynthesis.speak(utterance);
      }

      if ("speechSynthesis" in window) {
        window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
      }

      // Directive Execution
      async function sendDirective(message) {
        if (!message || !message.trim()) return;

        if (window.speechSynthesis) window.speechSynthesis.cancel();
        reactorBox.classList.remove("speaking");

        appendLog("KYLE", message, "user");
        if (promptInput) promptInput.value = "";
        if (statusTools) {
          statusTools.textContent = "PROCESSING...";
          statusTools.classList.add("active");
        }

        try {
          const res = await fetch(`${API_BASE}/chat`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": `Bearer ${authToken.trim()}`
            },
            body: JSON.stringify({ message: message, session_id: sessionId })
          });

          if (res.status === 403) {
            throw new Error("403 Forbidden: Bearer token rejected. Click [SET AUTH TOKEN].");
          }

          if (!res.ok) {
            const errorPayload = await res.json().catch(() => ({}));
            throw new Error(errorPayload.detail || `HTTP ${res.status}`);
          }

          const data = await res.json();
          appendLog("ARGUS", data.reply);
          speakDirective(data.reply);
        } catch (err) {
          appendLog("ERROR", `Directive failed: ${err.message}`, "error");
        } finally {
          if (statusTools) {
            statusTools.textContent = "SYSTEM IDLE";
            statusTools.classList.remove("active");
          }
        }
      }

      // Voice Capture
      async function toggleVoiceRecording() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          appendLog("ERROR", "Microphone API requires HTTPS context.", "error");
          return;
        }

        if (window.speechSynthesis) window.speechSynthesis.cancel();
        reactorBox.classList.remove("speaking");

        if (!isRecording) {
          try {
            activeStream = await navigator.mediaDevices.getUserMedia({
              audio: {
                echoCancellation: true,
                noiseSuppression: true,
                autoGainControl: true,
                sampleRate: 44100
              }
            });

            initVisualizer(activeStream);

            let mimeType = "audio/webm;codecs=opus";
            if (!MediaRecorder.isTypeSupported(mimeType)) {
              if (MediaRecorder.isTypeSupported("audio/webm")) {
                mimeType = "audio/webm";
              } else if (MediaRecorder.isTypeSupported("audio/mp4")) {
                mimeType = "audio/mp4";
              } else {
                mimeType = "";
              }
            }

            mediaRecorder = mimeType ? new MediaRecorder(activeStream, { mimeType }) : new MediaRecorder(activeStream);
            audioChunks = [];

            mediaRecorder.ondataavailable = (e) => {
              if (e.data && e.data.size > 0) {
                audioChunks.push(e.data);
              }
            };

            mediaRecorder.onstop = async () => {
              if (audioSource) {
                audioSource.disconnect();
                audioSource = null;
              }

              if (activeStream) {
                activeStream.getTracks().forEach(t => t.stop());
                activeStream = null;
              }

              const actualType = mediaRecorder.mimeType || "audio/webm";
              const audioBlob = new Blob(audioChunks, { type: actualType });

              if (audioBlob.size < 4000) {
                appendLog("SYSTEM", "Audio sample too short or silent. Please speak clearly.", "system");
                if (voiceLabel) voiceLabel.textContent = "CLICK CORE OR [MIC] TO TRANSMIT";
                return;
              }

              if (voiceLabel) voiceLabel.textContent = "TRANSCRIBING AUDIO...";
              if (statusTools) statusTools.textContent = "WHISPER TRANSCRIBING...";

              const ext = actualType.includes("mp4") ? "m4a" : "webm";
              const formData = new FormData();
              formData.append("file", audioBlob, `speech.${ext}`);

              try {
                const res = await fetch(`${API_BASE}/transcribe`, {
                  method: "POST",
                  headers: { "Authorization": `Bearer ${authToken.trim()}` },
                  body: formData
                });

                if (res.status === 403) {
                  throw new Error("403 Forbidden: Bearer token rejected. Click [SET AUTH TOKEN].");
                }

                if (!res.ok) {
                  const errorPayload = await res.json().catch(() => ({}));
                  throw new Error(errorPayload.detail || `HTTP ${res.status}`);
                }

                const data = await res.json();
                if (data.text && data.text.trim()) {
                  sendDirective(data.text);
                } else {
                  appendLog("SYSTEM", "No clear speech detected. Speak closer to the microphone.", "system");
                }
              } catch (err) {
                appendLog("ERROR", `Transcription failed: ${err.message}`, "error");
              } finally {
                if (voiceLabel) voiceLabel.textContent = "CLICK CORE OR [MIC] TO TRANSMIT";
                if (statusTools) statusTools.textContent = "SYSTEM IDLE";
              }
            };

            mediaRecorder.start(200);
            isRecording = true;
            if (reactorBox) reactorBox.classList.add("recording");
            if (micBtn) micBtn.classList.add("active");
            if (voiceLabel) voiceLabel.textContent = "RECORDING... CLICK WHEN FINISHED SPEAKING";
            appendLog("SYSTEM", "Listening to audio input...", "system");

          } catch (err) {
            appendLog("ERROR", `Hardware access error: ${err.name} - ${err.message}`, "error");
            if (voiceLabel) voiceLabel.textContent = "MIC ACCESS ERROR";
          }
        } else {
          if (mediaRecorder && mediaRecorder.state !== "inactive") {
            mediaRecorder.requestData();
            setTimeout(() => {
              if (mediaRecorder && mediaRecorder.state !== "inactive") {
                mediaRecorder.stop();
              }
            }, 300);
          }
          isRecording = false;
          if (reactorBox) reactorBox.classList.remove("recording");
          if (micBtn) micBtn.classList.remove("active");
        }
      }

      if (execBtn) {
        execBtn.addEventListener("click", () => sendDirective(promptInput ? promptInput.value : ""));
      }

      if (promptInput) {
        promptInput.addEventListener("keydown", (e) => {
          if (e.key === "Enter") sendDirective(promptInput.value);
        });
      }

      if (micBtn) micBtn.addEventListener("click", toggleVoiceRecording);
      if (reactorBox) reactorBox.addEventListener("click", toggleVoiceRecording);
    });
  </script>
</body>
